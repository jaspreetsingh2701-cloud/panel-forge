name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://panelforge:panelforge-ci@localhost:5432/panelforge
      JWT_ACCESS_SECRET: panelforge-ci-only-secret-do-not-use-outside-ci
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @panelforge/api typecheck

      - name: Typecheck web
        run: pnpm --filter @panelforge/web typecheck

      - name: Build API
        run: pnpm --filter @panelforge/api build

      - name: Build web
        run: pnpm --filter @panelforge/web build
