name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality, tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: panelforge
          POSTGRES_PASSWORD: panelforge-ci
          POSTGRES_DB: panelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panelforge -d panelforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://panelforge:panelforge-ci@localhost:5432/panelforge_test
      JWT_ACCESS_SECRET: panelforge-ci-only-secret-do-not-use-outside-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.11
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Generate Prisma client
        run: pnpm --filter @panelforge/api db:generate
      - name: Apply Prisma migrations
        run: pnpm --filter @panelforge/api exec prisma migrate deploy
      - name: API unit tests and coverage
        run: pnpm --filter @panelforge/api test:coverage
      - name: PostgreSQL integration tests
        run: pnpm --filter @panelforge/api test:integration
      - name: Web component tests and coverage
        run: pnpm --filter @panelforge/web test:coverage
      - name: Typecheck API
        run: pnpm --filter @panelforge/api typecheck
      - name: Typecheck web
        run: pnpm --filter @panelforge/web typecheck
      - name: Build API
        run: pnpm --filter @panelforge/api build
      - name: Build web
        run: pnpm --filter @panelforge/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @panelforge/web exec playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: pnpm --filter @panelforge/web test:e2e
