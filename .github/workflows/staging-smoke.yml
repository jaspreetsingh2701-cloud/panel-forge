name: Staging smoke verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify provisioned staging services
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Validate staging configuration
        env:
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          test -n "$STAGING_WEB_URL" || (echo "Missing STAGING_WEB_URL in protected staging environment" && exit 1)
          test -n "$STAGING_API_URL" || (echo "Missing STAGING_API_URL in protected staging environment" && exit 1)
      - name: Check web availability
        env:
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$STAGING_WEB_URL"
      - name: Check API and PostgreSQL readiness
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$STAGING_API_URL/api/v1/health"
